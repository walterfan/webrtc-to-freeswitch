[project]
name = "webrtc-to-freeswitch-backend"
version = "0.1.0"
description = "FastAPI config and static-asset service for the WebRTC FreeSWITCH client"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "uvicorn[standard]>=0.29,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "mypy>=1.10",
  "pytest>=8,<9",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
ignore = ["TRY004"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["app"]
